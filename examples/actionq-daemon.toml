# C-minimum daemon configuration. Keep this at ~/.config/actionq/config.toml
# on devbox, with ACTIONQ_URL supplied through the environment.
[global]
artifact_root = "/var/lib/actionq/artifacts"
poll_interval_seconds = 30
heartbeat_interval_seconds = 60
graceful_shutdown_seconds = 30
default_timeout_minutes = 30
session_state_path = "~/.local/state/actionq/sessions.json"
pause_file = "~/.local/state/actionq/PAUSED"
actionctl_bin = "actionctl"

# Tier-1 deterministic context injection at session start (item #1116).
# Requests a bounded sprintctl `context-candidates --json` packet before the
# child starts; only a found, claim_eligible explicit target (never an
# advisory candidate) may trigger a pre-start `sprintctl claim start`. See
# docs/plans/actionq-server-daemon-workstream-c-plan.md.
# [global.context]
# enabled = false
# remote_only = true
# limit = 5
# auto_claim = true

# Disposable smoke only. Production scope-iterate configuration must select
# runner = "scope-iterate", enable exact-target context claims, configure a
# harness/model route, and supply every explicit policy key documented by
# actionq.scope_iterate.load_policy.
[actions.scope-iterate]
runner = "fake"
fake_duration_seconds = 1
# Production scope-iterate actions set this true after provisioning the
# owner-only durable [global].artifact_root above.
publish_candidate = false
