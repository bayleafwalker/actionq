[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actionq"
version = "0.1.28"
description = "Operational-domain action queue for deterministic agent dispatch"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Juha Huotari" },
]
keywords = ["action-queue", "agent", "cli", "dispatch", "postgres", "queue"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "actionq-contracts==0.1.1",
    "click>=8.1",
    "cryptography>=45",
    "psycopg[binary]>=3.1",
    "vuoro-adapter-kit @ https://github.com/bayleafwalker/vuoro/releases/download/vuoro-adapter-kit-v0.1.1/vuoro_adapter_kit-0.1.1-py3-none-any.whl#sha256=0dac880d790857fbed1085906f0e2ffd151c509ab61d527a351b68f3775ee16f",
    "vuoro-schema-runtime @ https://github.com/bayleafwalker/vuoro/releases/download/vuoro-schema-runtime-v0.1.0/vuoro_schema_runtime-0.1.0-py3-none-any.whl#sha256=b66c9357c99aa9e1a7353991ce54105a8621958ecfac47f8c121d80b90b77912",
]

[project.urls]
Homepage = "https://github.com/bayleafwalker/actionq"
Repository = "https://github.com/bayleafwalker/actionq"
Issues = "https://github.com/bayleafwalker/actionq/issues"

[project.scripts]
actionctl = "actionq.cli:cli"
actionq-completion-outbox = "actionq.completion_outbox:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["actionq*"]

[tool.setuptools.package-data]
actionq = ["migrations/*.sql", "federation_migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
]

[tool.uv.workspace]
members = ["packages/actionq-contracts", "packages/actionq-runner"]

[tool.uv.sources]
actionq-contracts = { workspace = true }
