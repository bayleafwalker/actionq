name: Publish ActionQ server image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.1.18)"
        required: true
        type: string

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted workflow tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: workflow-tools
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          path: release-src
      - id: source
        name: Verify checked-out release tag and source version
        working-directory: release-src
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python ../workflow-tools/.github/scripts/verify-release-image-tag.py --tag "$TAG" --github-output "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: release-src
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/actionq-server:${{ steps.source.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/actionq-server:sha-${{ steps.source.outputs.sha }}
      - name: Generate GitHub build provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/actionq-server
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
