apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    appservice.kotona.app/image-digest: sha256:2d5121cfc0c35c54fb872bab1bdfaa00709573af09f8205abeb58330c93b4e2d
    appservice.kotona.app/release: actionq-v0.1.26
    deployment.kubernetes.io/revision: '26'
  labels:
    app.kubernetes.io/name: actionq-server
    kustomize.toolkit.fluxcd.io/name: actionq-server
    kustomize.toolkit.fluxcd.io/namespace: flux-system
  name: actionq-server
  namespace: vscode
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: actionq-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actionq-server
    spec:
      containers:
      - env:
        - name: PORT
          value: '8080'
        - name: HOST
          value: 0.0.0.0
        - name: ACTIONQ_URL
          valueFrom:
            secretKeyRef:
              key: uri
              name: actionq-runtime
        - name: ACTIONQ_SCHEMA
          value: actionq
        - name: ACTIONQ_RUNNER_IDENTITY_REGISTRY
          value: /run/actionq/runner-registry.json
        - name: ACTIONQ_ARTIFACT_ROOT
          value: /var/lib/actionq/artifacts
        image: ghcr.io/bayleafwalker/actionq-server@sha256:2d5121cfc0c35c54fb872bab1bdfaa00709573af09f8205abeb58330c93b4e2d
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: server
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 20m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/actionq/artifacts
          name: workspace
          subPath: dev/actionq-cas
        - mountPath: /run/actionq/runner-registry.json
          name: runner-identity-registry
          readOnly: true
          subPath: registry.json
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: truenas-workspace-pvc
      - configMap:
          defaultMode: 292
          items:
          - key: registry.json
            path: registry.json
          name: actionq-runner-identity-registry
        name: runner-identity-registry

